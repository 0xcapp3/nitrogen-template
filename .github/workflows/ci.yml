on: [push, pull_request]

name: CI

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Single source of truth for the Node version, shared with mise.toml
          # and `engines.node`. The range is capped below 25 because Corepack,
          # used on the next line, was removed from the Node distribution there.
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # `check` = lint + (react-router typegen && tsc --noEmit) + unit tests + build.
      # The typegen step is why this can't be a bare `tsc --noEmit`.
      - name: Lint, typecheck, unit test and build
        run: yarn check

      # Pulled ahead of the test run on purpose. testcontainers gives itself
      # only 10s to see a container's ports bound, and on a cold image cache the
      # pull eats that budget and the run fails before Postgres is even reached.
      - name: Pre-pull the test database image
        run: docker pull postgres:17-alpine

      - name: Integration tests
        run: yarn test:integration
        env:
          # The runner is thrown away after the job, so there are no orphaned
          # containers for Ryuk to reap — and skipping it removes a second
          # image pull from the critical path.
          TESTCONTAINERS_RYUK_DISABLED: true
